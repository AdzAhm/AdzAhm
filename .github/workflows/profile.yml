# Profile cards
#
# Builds the images on the profile README and commits them to profile/:
#   profile/stats.svg, profile/top-langs.svg   GitHub stats cards (github-readme-stats)
#   profile/pin-<repo>.svg                     featured project cards (repos listed in README.md)
#   profile/contrib-3d.svg                     3D contribution calendar
#   profile/metrics-lines.svg                  lines of code pushed      (lowlighter/metrics)
#   profile/trophies.svg                       trophies                  (ryo-ma/github-profile-trophy)
#   profile/space-shooter.gif                  contribution graph as a space shooter
#
# It runs every day, when started by hand (Actions > Profile cards > Run workflow),
# and whenever README.md, this file or scripts/commit-generated.sh changes on main.
#
# Everything works with the built-in GITHUB_TOKEN except the metrics card,
# which need a personal access token:
#   1. github.com/settings/tokens > Generate new token > Generate new token (classic).
#      Fine-grained tokens do not work with metrics. Set Expiration to a long
#      period (or No expiration): when it runs out, these two cards stop updating
#      until you put a new token in the secret. No scopes are needed. To count
#      private contributions, turn on "Include private contributions on my
#      profile" in your GitHub profile settings.
#   2. This repository > Settings > Secrets and variables > Actions >
#      New repository secret. Name it METRICS_TOKEN and paste the token.
#   3. Run this workflow once by hand.
# Without that secret the metrics step is skipped and everything else still updates.
#
# Every generator step may fail without failing the run: the previous image
# stays in place until the next successful run.

name: Profile cards

on:
  schedule:
    - cron: "23 2 * * *" # daily, 02:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md # the featured project list lives there
      - .github/workflows/profile.yml
      - scripts/commit-generated.sh

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }} # the current tip, not the commit the run was queued at
          fetch-depth: 2

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&border_radius=10&include_all_commits=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&border_radius=10
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # The featured repos are whatever README.md links as profile/pin-<repo>.svg,
      # so changing the list only means editing the README.
      - name: Find featured projects
        id: featured
        run: |
          mapfile -t repos < <(grep -oE 'profile/pin-[A-Za-z0-9._-]+\.svg' README.md \
            | sed -E 's#^profile/pin-(.+)\.svg$#\1#' | awk '!seen[$0]++')
          if [ "${#repos[@]}" -gt 6 ]; then
            echo "::warning::README.md lists ${#repos[@]} project cards; only the first 6 are built."
          fi
          for i in 1 2 3 4 5 6; do
            echo "pin$i=${repos[$((i - 1))]:-}" >> "$GITHUB_OUTPUT"
          done
          echo "Featured: ${repos[*]:0:6}"
          # Drop cards for repos that are no longer in the README.
          for f in profile/pin-*.svg; do
            [ -e "$f" ] || continue
            name="${f#profile/pin-}"; name="${name%.svg}"
            printf '%s\n' "${repos[@]:0:6}" | grep -qxF -- "$name" || rm -f -- "$f"
          done

      - name: Project card 1
        if: steps.featured.outputs.pin1 != ''
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=${{ steps.featured.outputs.pin1 }}&theme=tokyonight&hide_border=true&border_radius=10&description_lines_count=3
          path: profile/pin-${{ steps.featured.outputs.pin1 }}.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Project card 2
        if: steps.featured.outputs.pin2 != ''
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=${{ steps.featured.outputs.pin2 }}&theme=tokyonight&hide_border=true&border_radius=10&description_lines_count=3
          path: profile/pin-${{ steps.featured.outputs.pin2 }}.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Project card 3
        if: steps.featured.outputs.pin3 != ''
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=${{ steps.featured.outputs.pin3 }}&theme=tokyonight&hide_border=true&border_radius=10&description_lines_count=3
          path: profile/pin-${{ steps.featured.outputs.pin3 }}.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Project card 4
        if: steps.featured.outputs.pin4 != ''
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=${{ steps.featured.outputs.pin4 }}&theme=tokyonight&hide_border=true&border_radius=10&description_lines_count=3
          path: profile/pin-${{ steps.featured.outputs.pin4 }}.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Project card 5
        if: steps.featured.outputs.pin5 != ''
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=${{ steps.featured.outputs.pin5 }}&theme=tokyonight&hide_border=true&border_radius=10&description_lines_count=3
          path: profile/pin-${{ steps.featured.outputs.pin5 }}.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Project card 6
        if: steps.featured.outputs.pin6 != ''
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=${{ steps.featured.outputs.pin6 }}&theme=tokyonight&hide_border=true&border_radius=10&description_lines_count=3
          path: profile/pin-${{ steps.featured.outputs.pin6 }}.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Keep the night-view calendar
        run: |
          mkdir -p profile
          if [ -s profile-3d-contrib/profile-night-view.svg ]; then
            mv profile-3d-contrib/profile-night-view.svg profile/contrib-3d.svg
          fi
          rm -rf profile-3d-contrib

      - name: Check for METRICS_TOKEN
        id: metrics
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -n "$METRICS_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Metrics skipped::Add a METRICS_TOKEN repository secret to build the metrics cards. Steps are at the top of .github/workflows/profile.yml."
          fi

      # The metrics steps must not have an `id:`. Metrics reads the step id to tell
      # whether it is the official action; with an id it skips its prebuilt image
      # and tries to build one from scratch, which currently fails.
      # (The achievements and habits plugins are broken upstream since GitHub
      # retired Projects classic and dropped commits from push events; the lines
      # plugin used here avoids both.)
      - name: Metrics - lines of code
        if: steps.metrics.outputs.enabled == 'true'
        uses: lowlighter/metrics@latest
        continue-on-error: true
        timeout-minutes: 8
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-lines.svg
          output_action: none
          # Fail on plugin errors instead of drawing the error into the image.
          plugins_errors_fatal: yes
          retries: 2
          retries_delay: 30
          base: ""
          plugin_lines: yes
          # The chart only; the per-repo list would name projects outside Featured projects.
          plugin_lines_sections: history
          plugin_lines_history_limit: 1
          # GitHub computes these stats on first request; wait for them.
          plugin_lines_delay: 30
          # Skip this repo: its daily image commits would inflate the totals.
          plugin_lines_skipped: ${{ github.repository }}

      - name: Collect metrics images
        if: steps.metrics.outputs.enabled == 'true'
        run: |
          mkdir -p profile
          missing=""
          for f in metrics-lines.svg; do
            if sudo test -s "/metrics_renders/$f"; then
              sudo cp "/metrics_renders/$f" "profile/$f"
            else
              missing="$missing $f"
            fi
          done
          sudo chown -R "$(id -u):$(id -g)" profile
          if [ -n "$missing" ]; then
            echo "::warning title=Metrics not updated::Not rendered:$missing. See the metrics steps above; 'Bad credentials' there means METRICS_TOKEN has expired or been revoked."
          fi

      # Trophies, rendered here instead of by the (paused) hosted service.
      # It writes profile/trophies.svg only after a successful fetch and never commits.
      - name: Trophies
        uses: ryo-ma/github-profile-trophy@43736b50a82fca73c8df1c81abb40aa03519975c # master, 2026-10-27
        continue-on-error: true
        timeout-minutes: 5
        with:
          username: ${{ github.repository_owner }}
          output_path: profile/trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: tokyonight

      - name: Commit images
        run: bash scripts/commit-generated.sh "Update profile cards"

  # Separate job so the cards above go live even if this slower one takes a while.
  space-shooter:
    needs: cards
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          # The latest tip, including the commit the cards job just pushed.
          ref: ${{ github.ref }}
          fetch-depth: 2

      - run: mkdir -p profile

      - name: Space shooter
        # The @v2 tag and every v2.0.x release lack the no-commit input and always
        # commit + push on their own. 158ae82 is the merge (PR #50) that adds it;
        # switch back to a version tag once a release after 2.0.5 includes it.
        uses: czl9707/gh-space-shooter@158ae82cc0dc704f06a71c87dc40afdfebcc6f88
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: profile/space-shooter.gif
          strategy: random
          fps: "30"
          no-commit: "true"

      - name: Commit images
        run: bash scripts/commit-generated.sh "Update profile cards"
